<h3>Clotho 1.0.4</h3>
<ul>
  <li><b>Drag to reorder.</b> Drag workspaces in the sidebar and tabs in the tab bar to put them in the order you want.</li>
  <li><b>Move a tab to another workspace.</b> Drop a tab on a workspace in the sidebar; its panes keep running. Comes with clothod 0.1.22.</li>
</ul>
