<h3>Clotho 1.0.2</h3>
<ul>
  <li><b>Renaming a tab keeps the cursor.</b> A busy pane no longer pulls the keyboard back to the terminal while you type the new name.</li>
  <li><b>Shortcuts with ⇧⌘ work again.</b> ⌘R renames the tab (not the workspace), and ⇧⌘R, ⇧⌘W, ⇧⌘D, ⇧⌘O and the others work from the menu.</li>
</ul>
