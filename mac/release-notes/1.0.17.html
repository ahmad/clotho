<h3>Clotho 1.0.17</h3>
<ul>
  <li><b>Highlight workspaces.</b> Right-click a workspace in the sidebar and choose Highlight to give it a colour, as you would tag a file in Finder. Its row gets a soft tint in that colour, in the sidebar and in ⌘P, so the ones that matter stand out. Choose None to take it off.</li>
</ul>
