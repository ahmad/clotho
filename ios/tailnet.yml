# Clotho's own tailnet node (PLAN.md, "Built-in Tailscale", Phase 0): the ClothoTailnet package (a Go runtime of
# about 20 MB) and the debug-only Tailnet Test screen. Included only with TAILNET=YES, which build.sh passes for
# CLOTHO_TAILNET=1 after checking that ../ClothoKit/Tailnet/build/ClothoTailnet.xcframework exists (build it in
# this mirror with ClothoKit/scripts/build-tailnet.sh --slices "ios-arm64 iossim-arm64"). testflight.sh never
# includes it and refuses an archive that links the node.
#
# ClothoTailnet links into the Clotho app target only. Never into ClothoNotify or ClothoWidget (the extensions
# stay Go-free), and never into ClothoTests or ClothoUITests: the tests run inside the app (TEST_HOST), and a
# second copy of the static Go archive in the test bundle would be a second Go runtime in one process. The
# tests reach the node only through the app's own Swift types (TailnetController).
packages:
  Tailnet:
    path: ../ClothoKit/Tailnet
targets:
  Clotho:
    dependencies:
      - package: Tailnet
        product: ClothoTailnet
    # The node's required-reason APIs (Go's runtime: stat family, mach_absolute_time): Tailnet/PrivacyInfo.xcprivacy
    # replaces the app's base manifest (Clotho/PrivacyInfo.xcprivacy) in the built app, after a check that it
    # declares everything the base one does. It is copied over the base file rather than added as a second
    # resource: two PrivacyInfo.xcprivacy resources in one target fail the build ("Multiple commands produce"), and
    # so would declaring the product file as this script's output, since Copy Bundle Resources writes it too. So the
    # phase has no outputs and runs every build. It runs after Copy Bundle Resources and before code signing, and it
    # can write into the app because the Clotho target sets ENABLE_USER_SCRIPT_SANDBOXING NO.
    postBuildScripts:
      - name: Tailnet privacy manifest
        script: python3 -I "$SRCROOT/scripts/check-privacy.py" superset "$SRCROOT/Clotho/PrivacyInfo.xcprivacy" "$SRCROOT/Tailnet/PrivacyInfo.xcprivacy" && cp "$SRCROOT/Tailnet/PrivacyInfo.xcprivacy" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/PrivacyInfo.xcprivacy"
        basedOnDependencyAnalysis: false
    settings:
      base:
        # A flag, not SWIFT_ACTIVE_COMPILATION_CONDITIONS: liveactivity.yml sets that one for these targets, and
        # one include's value would replace the other's.
        OTHER_SWIFT_FLAGS: $(inherited) -DCLOTHO_TAILNET
  ClothoTests:
    settings:
      base:
        OTHER_SWIFT_FLAGS: $(inherited) -DCLOTHO_TAILNET
  ClothoUITests:
    settings:
      base:
        OTHER_SWIFT_FLAGS: $(inherited) -DCLOTHO_TAILNET
