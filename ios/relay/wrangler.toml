name = "clotho-push"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Deploy with `npm run deploy` (deploy.sh), never a bare `wrangler deploy`: the account comes from the wrangler
# login (or CLOUDFLARE_ACCOUNT_ID), and deploy.sh passes APNS_TEAM_ID and APNS_KEY_ID with `--var` from the
# environment (CLOTHO_TEAM_ID, CLOTHO_APNS_KEY_ID), so no account, team or key ID is in this file. A deploy
# without them would leave the Worker unable to sign for APNs.
[vars]
APNS_TOPIC = "nyc.amin.clotho"
HANDLE_KEY_ID = "1"

# Secrets, set with `wrangler secret put <NAME>` (never in this file):
#   APNS_KEY      contents of AuthKey_<KEYID>.p8
#   HANDLE_KEYS   {"1": "<base64 of 32 random bytes>"}

# Per-handle cap. The binding only counts over 10 s or 60 s, so this is a burst limit (10 a minute);
# the hourly limit (60 per device) is clothod's.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Live Activity updates (/v1/activity), per handle: a burst limit like the alerts'. clothod sends at most one
# update per activity every 10 s; an activity's end isn't counted.
[[unsafe.bindings]]
name = "ACTIVITY_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
