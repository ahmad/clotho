[workspace]
resolver = "2"
members = ["crates/proto", "crates/vt", "crates/holder", "crates/clothod", "crates/cli"]

[workspace.package]
version = "0.1.30"
edition = "2021"

[workspace.dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
nix = { version = "0.29", features = ["term", "process", "fs", "signal", "ioctl", "user", "socket"] }
libc = "0.2"
tempfile = "3"

clotho-proto = { path = "crates/proto" }
clotho-vt = { path = "crates/vt" }
clotho-holder = { path = "crates/holder" }
clothod = { path = "crates/clothod" }
clotho = { path = "crates/cli" }

# A one-line memory patch to alacritty_terminal (vendor/alacritty_terminal/VENDORED.md).
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
