[package]
name = "clothod"
version.workspace = true
edition.workspace = true

[dependencies]
clotho-proto.workspace = true
clotho-vt.workspace = true
clotho-holder.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
nix.workspace = true
libc.workspace = true
toml_edit = "0.22"
base64 = "0.22"
hpke = { version = "0.15", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
ureq = "2"
sha2 = "0.10"
mimalloc = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
clotho.workspace = true
tempfile.workspace = true

[features]
mimalloc = ["dep:mimalloc"]
