# Static Linux builds: ring (TLS for push alerts) has C code, so cross builds from a Mac go through
# cargo-zigbuild (brew install zig; cargo install cargo-zigbuild), which sets its own linker:
#   cargo zigbuild --release --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
# rust-lld below is for crates without C code (and native builds on Linux need musl-gcc).
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

# Release binaries for every platform clients bundle: scripts/dist.sh (writes dist/).
